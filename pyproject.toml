[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolia"
version = "0.1.0a0"
description = "Explore, acquire, and transform content from idol game worlds."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "Ziyuan Chen"}]
keywords = ["idol", "game-assets", "unity", "octo", "gakumas", "idoly-pride"]
dependencies = ["requests>=2.28", "cryptography>=40", "protobuf>=4.21"]

[project.optional-dependencies]
media = ["Pillow>=10", "UnityPy<=1.10.18", "pydub>=0.25"]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
